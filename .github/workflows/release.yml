name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach artifacts to (e.g. v1.1.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Bundle renderer
        run: npm run bundle

      - name: Smoke test
        if: matrix.os == 'macos-latest'
        run: npx electron test/smoke.js

      # ---------- macOS: DMG arm64 + x64 ----------
      - name: Build macOS DMG (arm64 + x64)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.dmg

      # ---------- Windows: NSIS installer ----------
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            dist/*.exe
            dist/*.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # Neither softprops/action-gh-release ("Error creating asset temp dir") nor
      # `gh release upload` (hangs indefinitely) could attach a 130 MB DMG, so the
      # uploads API is called directly, one file at a time, with retries.
      - name: Upload installers to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          id=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            id=$(curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
              "$api/releases" -d "$(jq -n --arg t "$TAG" '{tag_name:$t, name:$t}')" | jq -r .id)
          fi
          echo "Release id: $id"

          existing=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/$id/assets")

          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 |
          while IFS= read -r -d '' f; do
            name=$(basename "$f" | tr ' ' '.')
            old=$(echo "$existing" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id')
            if [ -n "$old" ]; then
              curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/assets/$old"
            fi

            for attempt in 1 2 3; do
              echo "Uploading $name (attempt $attempt, $(du -h "$f" | cut -f1))"
              code=$(curl -sS -o /tmp/upload.out -w '%{http_code}' --max-time 900 \
                -X POST -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name") || code=000
              if [ "$code" = "201" ]; then
                echo "  ok"
                break
              fi
              echo "  HTTP $code: $(head -c 300 /tmp/upload.out)"
              if [ "$attempt" = 3 ]; then
                exit 1
              fi
              sleep 20
            done
          done
